name: Feature request
description: Suggest a product feature or UX improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the idea in a way that makes the user value obvious.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: What is the idea?
      placeholder: Add a first-run onboarding flow for selecting the target drive
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve
      placeholder: A new user does not understand which external disk should be selected on first launch
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Add a first-run wizard for selecting the target drive and default behavior
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Is there another way to solve the same problem?
      placeholder: A tooltip in settings would help, but a full onboarding flow would be clearer

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app
        - Web UI
        - Encryption / archives
        - Release / packaging
        - Docs / GitHub
        - Other
    validations:
      required: true
