name: Bug report
description: Report a product, release, or documentation problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please make the problem easy to reproduce.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: What broke?
      placeholder: The app does not switch to the preferred drive after it is mounted
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What should someone do to see the bug?
      placeholder: |
        1. Launch the app
        2. Connect the external drive
        3. Open the vault
        4. Observe the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The app should detect the drive and offer to open it
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: The status remains disconnected even though the drive is mounted
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - Multiple
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release number or commit if known
      placeholder: v0.2.0

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add logs, trace output, screenshots, or any useful details
      render: text
