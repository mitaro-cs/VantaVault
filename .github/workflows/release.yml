name: VantaVault Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
            exit 0
          fi

          gh release create "$TAG_NAME" \
            --title "VantaVault $TAG_NAME" \
            --verify-tag \
            --latest \
            --generate-notes \
            --notes "$(cat <<'EOF'
          Downloads in this release:
          - macOS: signed application archive in `.dmg`
          - Windows: desktop build in `.exe`
          - Checksums: attached `.sha256.txt` files

          Recommended:
          Open the release assets below and download the file that matches your system.
          EOF
          )"

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: prepare-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-desktop.txt

      - name: Build DMG
        env:
          PYTHON_BIN: python
        run: ./scripts/build_mac.sh

      - name: Prepare versioned macOS assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-upload
          MAC_FILE="release-upload/VantaVault-${TAG_NAME}-macos.dmg"
          cp "release/VantaVault-mac.dmg" "$MAC_FILE"
          shasum -a 256 "$MAC_FILE" > "${MAC_FILE}.sha256.txt"

      - name: Upload macOS assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" \
            "release-upload/VantaVault-${TAG_NAME}-macos.dmg#VantaVault macOS (${TAG_NAME})" \
            "release-upload/VantaVault-${TAG_NAME}-macos.dmg.sha256.txt#SHA256 macOS (${TAG_NAME})" \
            --clobber

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: prepare-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-desktop.txt

      - name: Build EXE
        shell: pwsh
        env:
          PYTHON_BIN: python
        run: ./scripts/build_windows.ps1

      - name: Prepare versioned Windows assets
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path release-upload | Out-Null
          $exePath = "release-upload/VantaVault-$env:TAG_NAME-windows-x64.exe"
          Copy-Item "release/VantaVault.exe" $exePath -Force
          $hash = (Get-FileHash -Algorithm SHA256 $exePath).Hash.ToLower()
          "$hash *$(Split-Path -Leaf $exePath)" | Out-File "$exePath.sha256.txt" -Encoding ascii

      - name: Upload Windows assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release upload $env:TAG_NAME `
            "release-upload/VantaVault-$env:TAG_NAME-windows-x64.exe#VantaVault Windows x64 ($env:TAG_NAME)" `
            "release-upload/VantaVault-$env:TAG_NAME-windows-x64.exe.sha256.txt#SHA256 Windows x64 ($env:TAG_NAME)" `
            --clobber
