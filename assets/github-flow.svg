<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowBg" x1="88" y1="62" x2="1186" y2="516" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060607"/>
      <stop offset="0.5" stop-color="#0E1116"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="flowLine" x1="172" y1="282" x2="1110" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9098A2"/>
      <stop offset="0.52" stop-color="#F1F4F7"/>
      <stop offset="1" stop-color="#8A929C"/>
