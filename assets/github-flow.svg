<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="86" y1="48" x2="1190" y2="522" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121826"/>
      <stop offset="1" stop-color="#0A0E18"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(276 220) rotate(90) scale(184 164)">
      <stop stop-color="#7D92FF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7D92FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(932 352) rotate(90) scale(196 180)">
      <stop stop-color="#56C8FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#56C8FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E7ECFF" opacity="0.08"/>
    </pattern>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#93A5FF"/>
      <stop offset="1" stop-color="#5F78F6"/>
    </linearGradient>
    <clipPath id="canvasClip">
      <rect x="40" y="40" width="1200" height="480" rx="32"/>
    </clipPath>
  </defs>

  <rect width="1280" height="560" fill="#05070D"/>
  <rect x="40" y="40" width="1200" height="480" rx="32" fill="url(#bg)"/>

  <g clip-path="url(#canvasClip)">
    <rect x="40" y="40" width="1200" height="480" rx="32" fill="url(#dots)"/>
    <rect x="40" y="40" width="1200" height="480" rx="32" fill="url(#glowA)"/>
    <rect x="40" y="40" width="1200" height="480" rx="32" fill="url(#glowB)"/>

    <rect x="88" y="92" width="96" height="30" rx="9" fill="#171D29" stroke="#2D3748"/>
    <text x="136" y="111" fill="#F6F8FD" font-size="12" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Workflow</text>

    <rect x="196" y="92" width="78" height="30" rx="9" fill="#171D29" stroke="#2D3748"/>
    <text x="235" y="111" fill="#B8C2D8" font-size="12" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Docs</text>

    <rect x="286" y="92" width="84" height="30" rx="9" fill="#171D29" stroke="#2D3748"/>
    <text x="328" y="111" fill="#B8C2D8" font-size="12" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Issues</text>

    <rect x="928" y="92" width="90" height="30" rx="9" fill="#171D29" stroke="#2D3748"/>
    <text x="973" y="111" fill="#F6F8FD" font-size="12" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Share</text>

    <rect x="1030" y="92" width="130" height="30" rx="9" fill="url(#accent)"/>
    <text x="1095" y="111" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Contribute</text>

    <path d="M202 292H1078" stroke="#2A3447" stroke-width="4" stroke-linecap="round"/>
    <path d="M202 292H1078" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 16" opacity="0.52"/>

    <rect x="92" y="156" width="250" height="272" rx="24" fill="rgba(13,19,32,0.7)" stroke="url(#cardStroke)"/>
    <text x="122" y="200" fill="#8B96AE" font-size="16" font-family="Courier New, Menlo, monospace">01 / INSTALL</text>
    <text x="122" y="250" fill="#F6F8FD" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">Get the app</text>
    <text x="122" y="292" fill="#CBD3E2" font-size="19" font-family="Arial, Helvetica, sans-serif">
      <tspan x="122" dy="0">Download the DMG or EXE</tspan>
      <tspan x="122" dy="30">from GitHub Releases.</tspan>
    </text>
    <rect x="122" y="364" width="120" height="42" rx="14" fill="url(#accent)"/>
    <text x="182" y="390" fill="#FFFFFF" font-size="15" text-anchor="middle" font-family="Courier New, Menlo, monospace">release</text>
    <circle cx="304" cy="385" r="16" fill="#F6F8FD" stroke="#5F78F6" stroke-width="3"/>

    <rect x="366" y="156" width="250" height="272" rx="24" fill="rgba(13,19,32,0.7)" stroke="url(#cardStroke)"/>
    <text x="396" y="200" fill="#8B96AE" font-size="16" font-family="Courier New, Menlo, monospace">02 / CONNECT</text>
    <text x="396" y="250" fill="#F6F8FD" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">Detect the disk</text>
    <text x="396" y="292" fill="#CBD3E2" font-size="19" font-family="Arial, Helvetica, sans-serif">
      <tspan x="396" dy="0">The app watches the target</tspan>
      <tspan x="396" dy="30">drive and opens the vault.</tspan>
    </text>
    <rect x="396" y="364" width="122" height="42" rx="14" fill="#101826" stroke="#344054"/>
    <text x="457" y="390" fill="#F6F8FD" font-size="15" text-anchor="middle" font-family="Courier New, Menlo, monospace">mount</text>
    <circle cx="578" cy="385" r="16" fill="#F6F8FD" stroke="#5F78F6" stroke-width="3"/>

    <rect x="640" y="156" width="250" height="272" rx="24" fill="rgba(13,19,32,0.7)" stroke="url(#cardStroke)"/>
    <text x="670" y="200" fill="#8B96AE" font-size="16" font-family="Courier New, Menlo, monospace">03 / PROTECT</text>
    <text x="670" y="250" fill="#F6F8FD" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">Lock and archive</text>
    <text x="670" y="292" fill="#CBD3E2" font-size="19" font-family="Arial, Helvetica, sans-serif">
      <tspan x="670" dy="0">Use safe lockout, session</tspan>
      <tspan x="670" dy="30">guard and local AES flow.</tspan>
    </text>
    <rect x="670" y="364" width="130" height="42" rx="14" fill="#101826" stroke="#344054"/>
    <text x="735" y="390" fill="#F6F8FD" font-size="15" text-anchor="middle" font-family="Courier New, Menlo, monospace">secure</text>
    <circle cx="852" cy="385" r="16" fill="#F6F8FD" stroke="#5F78F6" stroke-width="3"/>

    <rect x="914" y="156" width="272" height="272" rx="24" fill="rgba(13,19,32,0.7)" stroke="url(#cardStroke)"/>
    <text x="944" y="200" fill="#8B96AE" font-size="16" font-family="Courier New, Menlo, monospace">04 / GROW</text>
    <text x="944" y="250" fill="#F6F8FD" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">Use and contribute</text>
    <text x="944" y="292" fill="#CBD3E2" font-size="19" font-family="Arial, Helvetica, sans-serif">
      <tspan x="944" dy="0">A public repo with docs,</tspan>
      <tspan x="944" dy="30">issues and clean onboarding.</tspan>
    </text>
    <rect x="944" y="364" width="118" height="42" rx="14" fill="#101826" stroke="#344054"/>
    <text x="1003" y="390" fill="#F6F8FD" font-size="15" text-anchor="middle" font-family="Courier New, Menlo, monospace">public</text>
    <circle cx="1152" cy="385" r="16" fill="#F6F8FD" stroke="#5F78F6" stroke-width="3"/>
  </g>
</svg>
