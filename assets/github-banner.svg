  <text x="96" y="334" fill="#31353B" font-size="24" font-weight="600" font-family="Arial, Helvetica, sans-serif">
    <tspan x="96" dy="0">A premium desktop vault for removable drives.</tspan>
    <tspan x="96" dy="38">Local access, safe lockout, and encrypted archive flow.</tspan>
  </text>

  <rect x="96" y="428" width="152" height="48" rx="24" fill="#111111"/>
  <text x="172" y="458" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Download</text>

  <rect x="264" y="428" width="126" height="48" rx="24" fill="#FFFFFF"/>
  <rect x="264.5" y="428.5" width="125" height="47" rx="23.5" stroke="#D8DDE4"/>
  <text x="327" y="458" fill="#111111" font-size="16" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Run Local</text>

  <text x="96" y="548" fill="#111111" font-size="34" font-weight="700" font-family="Arial, Helvetica, sans-serif">Quiet by design.</text>
  <text x="96" y="584" fill="#6C727B" font-size="19" font-family="Arial, Helvetica, sans-serif">Built to feel precise, calm, and effortless from the first launch.</text>

