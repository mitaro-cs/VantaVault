      <text x="88" y="256" fill="#F4F5F7" font-size="76" font-weight="700" font-family="Arial, Helvetica, sans-serif">VantaVault</text>

      <text x="88" y="332" fill="#E0E5EC" font-size="22" font-weight="600" font-family="Arial, Helvetica, sans-serif">
