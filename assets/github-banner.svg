    <rect x="338" y="86" width="82" height="32" rx="10" fill="#171A20" stroke="#2C3139"/>
    <text x="379" y="106" fill="#B8C0CB" font-size="12" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Users</text>

    <rect x="432" y="86" width="102" height="32" rx="10" fill="#171A20" stroke="#2C3139"/>
    <text x="483" y="106" fill="#B8C0CB" font-size="12" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Releases</text>

    <rect x="800" y="86" width="86" height="32" rx="10" fill="#171A20" stroke="#2C3139"/>
    <text x="843" y="106" fill="#F3F4F6" font-size="12" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">MIT</text>

    <rect x="900" y="86" width="104" height="32" rx="10" fill="#171A20" stroke="#2C3139"/>
    <text x="952" y="106" fill="#F3F4F6" font-size="12" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Share</text>

