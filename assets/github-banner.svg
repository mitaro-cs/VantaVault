      <tspan x="848" dy="30">Releases</tspan>
    </text>

    <rect x="1030" y="300" width="74" height="126" rx="22" fill="#0D1117" stroke="#343B45"/>
    <rect x="1044" y="318" width="46" height="86" rx="16" fill="url(#previewGlow)"/>
    <text x="1067" y="432" fill="#B4BDC8" font-size="11" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">preview</text>

    <rect x="820" y="442" width="142" height="52" rx="18" fill="#10141A" stroke="#2B3139"/>
    <text x="891" y="474" fill="#F4F5F7" font-size="15" text-anchor="middle" font-family="Courier New, Menlo, monospace">EXE + DMG</text>

    <rect x="978" y="442" width="142" height="52" rx="18" fill="#10141A" stroke="#2B3139"/>
    <text x="1049" y="474" fill="#F4F5F7" font-size="15" text-anchor="middle" font-family="Courier New, Menlo, monospace">COMMUNITY</text>
