  <rect x="854" y="280" width="152" height="96" rx="24" fill="#FFFFFF"/>
  <rect x="854.5" y="280.5" width="151" height="95" rx="23.5" stroke="#E4E7EB"/>
  <path d="M872 328H998" stroke="url(#screenBar)" stroke-width="10" stroke-linecap="round"/>
