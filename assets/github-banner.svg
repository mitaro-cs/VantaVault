<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="48" x2="1148" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFAFC"/>
      <stop offset="1" stop-color="#EEF1F5"/>
    </linearGradient>
    <linearGradient id="deviceBody" x1="800" y1="138" x2="1104" y2="486" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17181C"/>
      <stop offset="1" stop-color="#07080A"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="910" y1="228" x2="1012" y2="394" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="0.38" stop-color="#C8D2E6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7C92FF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="track" x1="866" y1="296" x2="1028" y2="296" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A4AFBF"/>
      <stop offset="1" stop-color="#E6E9EE"/>
    </linearGradient>
    <filter id="deviceShadow" x="730" y="112" width="420" height="432" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="boardShadow" x="24" y="26" width="1232" height="588" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0B0F14" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#F5F5F7"/>

  <g filter="url(#boardShadow)">
    <rect x="40" y="40" width="1200" height="560" rx="36" fill="url(#bg)"/>
    <rect x="40.5" y="40.5" width="1199" height="559" rx="35.5" stroke="#E4E7EB"/>
  </g>

  <text x="96" y="170" fill="#8E949E" font-size="14" letter-spacing="5" font-family="Courier New, Menlo, monospace">LOCAL DRIVE WORKSPACE</text>
  <text x="92" y="264" fill="#111111" font-size="84" font-weight="700" font-family="Arial, Helvetica, sans-serif">VantaVault</text>
  <text x="96" y="336" fill="#30353C" font-size="24" font-weight="600" font-family="Arial, Helvetica, sans-serif">
    <tspan x="96" dy="0">A clean desktop vault for removable drives.</tspan>
    <tspan x="96" dy="38">Local auth, safe lockout, and AES archives.</tspan>
  </text>

  <rect x="96" y="430" width="154" height="48" rx="24" fill="#111111"/>
  <text x="173" y="460" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Download</text>

  <rect x="264" y="430" width="122" height="48" rx="24" fill="#FFFFFF"/>
  <rect x="264.5" y="430.5" width="121" height="47" rx="23.5" stroke="#D8DDE4"/>
  <text x="325" y="460" fill="#111111" font-size="16" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Run Local</text>

  <text x="96" y="548" fill="#111111" font-size="34" font-weight="700" font-family="Arial, Helvetica, sans-serif">Quiet by design.</text>
  <text x="96" y="584" fill="#6B717B" font-size="19" font-family="Arial, Helvetica, sans-serif">Built for people who want their external drive workflow to feel simple and deliberate.</text>

  <g filter="url(#deviceShadow)">
    <rect x="776" y="132" width="318" height="376" rx="42" fill="url(#deviceBody)"/>
    <rect x="792" y="150" width="286" height="340" rx="32" fill="#0C0D10"/>
    <rect x="864" y="144" width="142" height="14" rx="7" fill="#1A1C20"/>
  </g>

  <rect x="822" y="184" width="226" height="62" rx="22" fill="#121317"/>
  <rect x="822.5" y="184.5" width="225" height="61" rx="21.5" stroke="#2A2E35"/>
  <circle cx="856" cy="215" r="11" fill="#FFFFFF"/>
  <text x="884" y="223" fill="#F7F8FA" font-size="20" font-weight="700" font-family="Arial, Helvetica, sans-serif">VantaVault connected</text>

  <rect x="822" y="270" width="226" height="140" rx="26" fill="#101115"/>
  <rect x="822.5" y="270.5" width="225" height="139" rx="25.5" stroke="#272B32"/>
  <text x="852" y="304" fill="#858B95" font-size="11" font-family="Courier New, Menlo, monospace">READY STATE</text>
  <path d="M852 330H1020" stroke="url(#track)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="966" cy="330" r="18" fill="#FFFFFF"/>
  <text x="852" y="386" fill="#F7F8FA" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">
    <tspan x="852" dy="0">Ready to</tspan>
    <tspan x="852" dy="34">open</tspan>
  </text>

  <rect x="930" y="296" width="84" height="108" rx="22" fill="url(#screenGlow)"/>
  <rect x="930.5" y="296.5" width="83" height="107" rx="21.5" stroke="#3B4350" stroke-opacity="0.18"/>

  <rect x="822" y="430" width="104" height="42" rx="21" fill="#FFFFFF"/>
  <text x="874" y="456" fill="#111111" font-size="15" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">macOS</text>

  <rect x="944" y="430" width="104" height="42" rx="21" fill="#1A1C21"/>
  <rect x="944.5" y="430.5" width="103" height="41" rx="20.5" stroke="#31353C"/>
  <text x="996" y="456" fill="#F7F8FA" font-size="15" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Windows</text>
</svg>
