    </pattern>
    <filter id="shadow" x="16" y="24" width="1248" height="592" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <clipPath id="boardClip">
