    </linearGradient>
    <linearGradient id="deviceBg" x1="784" y1="144" x2="1096" y2="494" gradientUnits="userSpaceOnUse">
      <stop stop-color="#191B20"/>
      <stop offset="1" stop-color="#07080A"/>
    </linearGradient>
    <linearGradient id="screenCard" x1="834" y1="258" x2="1018" y2="404" gradientUnits="userSpaceOnUse">
