<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageBg" x1="120" y1="42" x2="1150" y2="606" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFAFC"/>
      <stop offset="1" stop-color="#EEF1F5"/>
    </linearGradient>
    <linearGradient id="boardBg" x1="40" y1="40" x2="1240" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFCFD"/>
