<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageBg" x1="124" y1="64" x2="1152" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060709"/>
      <stop offset="0.5" stop-color="#0B0D11"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="boardBg" x1="56" y1="40" x2="1230" y2="596" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101217"/>
      <stop offset="1" stop-color="#0A0C10"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="760" y1="140" x2="1112" y2="498" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12161D"/>
      <stop offset="1" stop-color="#0D1015"/>
    </linearGradient>
    <linearGradient id="previewGlow" x1="982" y1="310" x2="1038" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAEFF8" stop-opacity="0.72"/>
      <stop offset="0.58" stop-color="#C8D1E0" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#98A4B7" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
