        <tspan x="88" dy="34">for removable drives.</tspan>
        <tspan x="88" dy="34">Auto-detect, lockout, AES archive, releases and docs.</tspan>
      </text>

      <rect x="88" y="428" width="188" height="48" rx="24" fill="#141820" stroke="#2E343D"/>
      <text x="182" y="458" fill="#F4F5F7" font-size="16" text-anchor="middle" font-family="Courier New, Menlo, monospace">AUTO DETECT</text>

      <rect x="292" y="428" width="164" height="48" rx="24" fill="#141820" stroke="#2E343D"/>
      <text x="374" y="458" fill="#F4F5F7" font-size="16" text-anchor="middle" font-family="Courier New, Menlo, monospace">AES ZIP</text>

      <rect x="472" y="428" width="186" height="48" rx="24" fill="#141820" stroke="#2E343D"/>
      <text x="565" y="458" fill="#F4F5F7" font-size="16" text-anchor="middle" font-family="Courier New, Menlo, monospace">SAFE LOCKOUT</text>

      <path d="M88 518H660" stroke="#232831" stroke-width="1.4"/>

      <text x="88" y="558" fill="#F4F5F7" font-size="34" font-weight="700" font-family="Arial, Helvetica, sans-serif">Built for users and contributors</text>
      <text x="88" y="590" fill="#9BA4B0" font-size="19" font-family="Arial, Helvetica, sans-serif">Issues · Releases · Docs · Cross-platform builds</text>
    </g>

    <path d="M660 450C712 450 728 450 774 450" stroke="#2D323B" stroke-width="2"/>

    <rect x="790" y="140" width="360" height="370" rx="30" fill="url(#panelBg)" stroke="#2E343D"/>

    <rect x="820" y="178" width="300" height="76" rx="22" fill="#10141A" stroke="#2B3139"/>
    <circle cx="860" cy="216" r="13" fill="#F4F5F7"/>
    <text x="894" y="224" fill="#F4F5F7" font-size="20" font-weight="700" font-family="Arial, Helvetica, sans-serif">VantaVault connected</text>

    <rect x="820" y="278" width="300" height="146" rx="24" fill="#10141A" stroke="#2B3139"/>
    <text x="848" y="312" fill="#8D96A3" font-size="11" font-family="Courier New, Menlo, monospace">OPEN SOURCE STATE</text>
    <path d="M848 346H970" stroke="#E6EBF2" stroke-width="10" stroke-linecap="round"/>
    <circle cx="960" cy="346" r="17" fill="#F4F5F7"/>
    <text x="848" y="392" fill="#F4F5F7" font-size="22" font-weight="700" font-family="Arial, Helvetica, sans-serif">
